<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme — Pinnables demo app</title>
<!--
  A deliberately inconsistent app to pin things in.

  The card styles here are the ones the fixture board complains about, so the
  demo board's story and this app agree: the Settings plan card is the good
  one, and the two Dashboard cards have drifted away from it.

  Routes are hash-based so navigating exercises the SPA path — the content
  script survives, and floating pins have to persist across the change.

  data-pin-source stands in for the dev-time Vite plugin, so source mapping can
  be demonstrated before that plugin exists.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    color: #1c1e22;
    background: #f7f7f5;
  }
  header {
    display: flex; align-items: center; gap: 22px;
    padding: 14px 28px; background: #fff; border-bottom: 1px solid #e6e4e0;
  }
  header b { font-size: 15px; }
  nav { display: flex; gap: 4px; }
  nav a {
    padding: 6px 12px; border-radius: 7px; text-decoration: none;
    color: #6b6f78; font-size: 14px;
  }
  nav a.on { background: #eef3fd; color: #1e3fd8; }
  main { padding: 30px 28px; max-width: 940px; }
  h1 { font-size: 25px; margin: 0 0 4px; }
  .sub { color: #6b6f78; margin: 0 0 24px; font-size: 14px; }
  .grid { display: flex; gap: 18px; flex-wrap: wrap; }
  .label { font-size: 13px; color: #6b6f78; }
  .big { font-size: 27px; font-weight: 600; margin-top: 6px; }

  /* Drifted — too much vertical padding, radius matches nothing. */
  .stat-card {
    background: #fff; padding: 32px 24px; border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); flex: 1; min-width: 210px;
  }
  /* Drifted — same padding problem, and no shadow at all. */
  .activity-card {
    background: #fff; padding: 28px 24px; border-radius: 6px;
    flex: 1; min-width: 260px;
  }
  /* The good one. This is the reference every other card should match. */
  .plan-card {
    background: #fff; padding: 16px 20px; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08); max-width: 300px;
  }
  .empty {
    border: 1px dashed #d4d4d4; border-radius: 2px; padding: 40px;
    text-align: center; color: #6b6f78;
  }
  button {
    font: inherit; border: none; background: #1e3fd8; color: #fff;
    padding: 9px 16px; border-radius: 8px; cursor: pointer; margin-top: 12px;
  }
  ul { margin: 10px 0 0; padding-left: 18px; color: #6b6f78; font-size: 14px; }
</style>
</head>
<body>

<header>
  <b>Acme</b>
  <nav>
    <a href="#/dashboard" data-route="/dashboard">Dashboard</a>
    <a href="#/settings" data-route="/settings">Settings</a>
    <a href="#/reports" data-route="/reports">Reports</a>
  </nav>
</header>

<main id="view"></main>

<script>
const views = {
  "/dashboard": `
    <h1>Dashboard</h1>
    <p class="sub">Two cards here have drifted from the Settings card.</p>
    <div class="grid">
      <article class="stat-card" data-pin-source="src/components/StatCard.tsx:12" data-pin-component="StatCard">
        <div class="label">Active users</div>
        <div class="big">2,481</div>
      </article>
      <article class="stat-card" data-pin-source="src/components/StatCard.tsx:12" data-pin-component="StatCard">
        <div class="label">Revenue</div>
        <div class="big">$18,204</div>
      </article>
      <article class="activity-card" data-pin-source="src/components/ActivityCard.tsx:21" data-pin-component="ActivityCard">
        <div class="label">Recent activity</div>
        <ul><li>Invite accepted</li><li>Plan upgraded</li><li>Report exported</li></ul>
      </article>
    </div>`,

  "/settings": `
    <h1>Settings</h1>
    <p class="sub">Manage your preferences and workspace settings.</p>
    <article class="plan-card" data-pin-source="src/components/SettingsCard.tsx:8" data-pin-component="SettingsCard">
      <div class="label">Team plan</div>
      <div class="big">$29</div>
      <div class="label">per user / month</div>
      <button>Get started</button>
    </article>`,

  "/reports": `
    <h1>Reports</h1>
    <p class="sub">Nothing generated yet.</p>
    <div class="empty" data-pin-source="src/components/EmptyState.tsx:5" data-pin-component="EmptyState">
      <div>No reports yet</div>
      <button>Create report</button>
    </div>`,
};

function render() {
  const route = location.hash.replace(/^#/, "") || "/dashboard";
  document.getElementById("view").innerHTML = views[route] ?? views["/dashboard"];
  document.querySelectorAll("nav a").forEach((a) => {
    a.classList.toggle("on", a.dataset.route === route);
  });
}

addEventListener("hashchange", render);
render();
</script>
</body>
</html>
