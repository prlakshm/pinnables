<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toggle menu — Pinnables mock</title>
<style>
/*
 * A mock of one interaction, on one real card.
 *
 * The card is lifted verbatim from fixtures/film-set/index.html — the same
 * VarietyCard (ACC 0612, Rose) the extension pins in the demo — so the chrome
 * is being judged against a component that actually exists rather than a grey
 * rectangle. Its tokens are the Accession set; the overlay's are the --pin-*
 * set from packages/extension/src/ui/ui.css, unchanged.
 *
 * Everything below the card is the thing being designed: a Toggle switch under
 * the send button, a branch that offers add or replace, and a persistent menu
 * of option keycaps beside the component.
 *
 * Light only. The page it overlays is paper by construction.
 */

/* ------------------------------------------------ accession (the set) */
:root {
  --paper: #ffffff;
  --sheet: #f6f3ea;
  --sheet-deep: #efeadb;
  --rule: #e2ddcd;
  --ink: #1b1a15;
  --ink-soft: #6d6857;
  --ink-faint: #a49d88;
  --green: #1d4a3a;
  --green-wash: #e9efe9;
  --stamp: #a33726;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  /* ------------------------------------------ pinnables (the overlay) */
  --pin-white: #ffffff;
  --pin-grey-50: #f6f5f3;
  --pin-grey-100: #efeeec;
  --pin-grey-150: #e4e2de;
  --pin-grey-200: #d3d2ce;
  --pin-grey-400: #a1a4ab;
  --pin-grey-500: #6b6f78;
  --pin-grey-600: #454b55;
  --pin-grey-900: #292c33;
  --pin-red-400: #f4564b;
  --pin-red-500: #ed1c24;

  --pin-paper: var(--pin-white);
  --pin-paper-soft: var(--pin-grey-50);
  --pin-paper-sunk: var(--pin-grey-100);
  --pin-rule: var(--pin-grey-150);
  --pin-rule-strong: var(--pin-grey-200);
  --pin-ink-faint: var(--pin-grey-400);
  --pin-ink-muted: var(--pin-grey-500);
  --pin-ink: var(--pin-grey-900);
  --pin-ink-lift: var(--pin-grey-600);
  --pin-off: var(--pin-grey-100);
  --pin-off-hover: var(--pin-grey-150);
  --pin-on-fill: var(--pin-ink);
  --pin-on-ink: var(--pin-paper);
  --pin-red: var(--pin-red-500);
  /* Darker than --pin-red for text on the tint, which the red itself does not
     clear at this size. Same hue, one step down. */
  --pin-red-ink: #b3151b;
  --pin-red-tint: color-mix(in srgb, var(--pin-red-400) 16%, transparent);
  --pin-measure-glow: color-mix(in srgb, var(--pin-grey-400) 30%, transparent);

  --pin-label-gap: 3px;
  --pin-radius-sm: 6px;
  --pin-radius: 10px;
  --pin-radius-lg: 16px;
  --pin-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --pin-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --pin-shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 4px 12px rgba(9, 9, 11, 0.08);
  --pin-shadow-lg: 0 1px 2px rgba(9, 9, 11, 0.08), 0 8px 28px rgba(9, 9, 11, 0.12);

  /* One number, so the collapse and the insert read as one motion. */
  --beat: 260ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px 24px 96px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ------------------------------------------------------ the rose card */
/* Verbatim from the film set, so what the chrome sits on is the real thing. */

.plate {
  background: var(--sheet);
  display: grid;
  place-items: center;
  aspect-ratio: 5 / 4;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
}
.plate svg { width: 62%; height: 62%; }
.plate .acc {
  position: absolute;
  left: 10px;
  bottom: 8px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
}
.card-name { font-family: var(--serif); font-size: 20px; letter-spacing: -0.01em; margin: 14px 0 1px; }
.card-latin { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 0 0 12px; }
.traits { display: flex; gap: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.traits b { display: block; font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--ink); letter-spacing: 0; text-transform: none; margin-top: 2px; }

.variety {
  width: 244px;
  background: var(--paper);
  border-radius: 14px;
  padding: 20px;
  border: 1px solid var(--rule);
  /* Every option is a set of overrides on these, so switching has to be
     watchable rather than instantaneous. */
  transition: background var(--beat) var(--ease), border-color var(--beat) var(--ease),
    border-radius var(--beat) var(--ease), padding var(--beat) var(--ease),
    box-shadow var(--beat) var(--ease);
}

/* ------------------------------------------------------- pin: the card */

.pin-object { position: relative; display: flex; flex-direction: column; width: max-content; }

.pin-object__card {
  position: relative;
  align-self: flex-start;
  display: flex;
  border-radius: 14px;
  background: var(--pin-paper);
}
.pin-object[data-selected="true"] .pin-object__card {
  box-shadow: 0 0 0 3px var(--pin-measure-glow), var(--pin-shadow);
}

.pin-object__label {
  position: absolute;
  top: 0;
  left: 0;
  transform: translateY(calc(-100% - var(--pin-label-gap)));
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "name close" "source close";
  column-gap: 8px;
  row-gap: 1px;
  width: 100%;
  padding: 5px 4px 5px 11px;
  border-radius: 8px 8px 0 0;
  background: var(--pin-ink);
  color: var(--pin-paper);
  box-shadow: var(--pin-shadow);
  font-family: var(--pin-font);
}
.pin-object__name { grid-area: name; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin-object__src {
  grid-area: source;
  font-family: var(--pin-mono);
  font-size: 10px;
  opacity: 0.72;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

/* ------------------------------------------------------- pin: the note */

.pin-note {
  margin-top: 8px;
  border: 1px solid var(--pin-rule);
  border-radius: var(--pin-radius-lg);
  background: var(--pin-paper);
  box-shadow: var(--pin-shadow);
  min-width: 300px;
  font-family: var(--pin-font);
  color: var(--pin-ink);
  position: relative;
}
/*
 * Kept as two selectors, the way ui.css writes it. Docked under a card the
 * note takes the card's width exactly (the more specific min-width wins), so
 * the two share one edge; the 300px floor above is for a note that is not
 * inside a pin object. Flattening them into one block reads like a 300px
 * minimum that silently never applies.
 */
.pin-object > .pin-note {
  width: 0;
  min-width: 100%;
}

.pin-note__body { display: flex; align-items: center; gap: 8px; padding: 6px 7px 6px 16px; }

.pin-note__input {
  flex: 1 1 auto;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font: inherit;
  font-size: 13px;
  padding: 4px 0;
  height: 26px;
  color: var(--pin-ink);
}
.pin-note__input::placeholder { color: var(--pin-ink-muted); }

.pin-note__send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex: 0 0 auto;
  border: none;
  border-radius: 999px;
  background: var(--pin-on-fill);
  color: var(--pin-on-ink);
  cursor: pointer;
  padding: 0;
  transition: background 120ms ease, color 120ms ease;
}
.pin-note__send:hover { background: var(--pin-ink-lift); }
/* The same "will not act" grey the disabled send uses in ui.css. */
.pin-note__send[data-idle="true"] {
  background: var(--pin-off);
  color: var(--pin-ink-faint);
  cursor: default;
}

/*
 * The switch sits directly under the send button, because the branch it opens
 * flies out from here and both gestures end in the same corner of the pill.
 */
.pin-note__toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px 7px 16px;
  border-top: 1px solid var(--pin-rule);
}
.pin-note__toggle label { flex: 1; font-size: 12px; color: var(--pin-ink-muted); }

.pin-switch {
  width: 30px;
  height: 18px;
  flex: 0 0 auto;
  border: none;
  border-radius: 999px;
  background: var(--pin-off);
  box-shadow: inset 0 0 0 1px var(--pin-rule-strong);
  padding: 0;
  position: relative;
  cursor: pointer;
  transition: background 180ms var(--ease), box-shadow 180ms var(--ease);
}
.pin-switch[aria-checked="true"] {
  background: var(--pin-on-fill);
  box-shadow: none;
}
.pin-switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  background: var(--pin-paper);
  box-shadow: 0 1px 1px rgba(9, 9, 11, 0.14);
  transition: left 180ms var(--ease);
}
.pin-switch[aria-checked="true"] i { left: 14px; }

.pin-note__hint {
  padding: 0 16px 9px;
  font-size: 11px;
  line-height: 1.45;
  /* Muted, not faint. Faint is for decoration; this line is the only place the
     interaction is explained, so it has to clear contrast on paper. */
  color: var(--pin-ink-muted);
  min-height: 17px;
}
.pin-note__hint b { color: var(--pin-ink); font-weight: 500; }
/* Keeping drops the losing snapshots, so the receipt carries a way back. */
.pin-note__undo {
  border: none;
  background: none;
  padding: 0;
  margin-left: 6px;
  font: inherit;
  font-size: 11px;
  color: var(--pin-ink);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

/* ------------------------------------------------------- the branch */
/*
 * Two choices, drawn as branches rather than stacked in a menu: the shape says
 * that one input is about to become two possible futures, which is the whole
 * decision being made.
 *
 * It lives outside .pin-note, not inside it. The pill is overflow: hidden in
 * ui.css — deliberately, so history can scroll inside it — and anything that
 * has to reach past its edge is clipped at the border radius. So the branch is
 * a sibling, seated in JS against the switch it grows out of.
 */
.pin-branch { position: absolute; z-index: 6; width: 0; height: 0; }
.pin-branch svg { position: absolute; left: 0; top: 0; overflow: visible; }

.pin-branch__opt {
  position: absolute;
  left: 34px;
  white-space: nowrap;
  border: 1px solid var(--pin-rule);
  border-radius: 999px;
  background: var(--pin-paper);
  box-shadow: var(--pin-shadow);
  font: inherit;
  font-size: 11px;
  color: var(--pin-ink);
  padding: 5px 13px;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-12px);
  animation: branch-in 220ms var(--ease) forwards;
}
.pin-branch__opt[data-role="add"] { top: -32px; animation-delay: 20ms; }
.pin-branch__opt[data-role="replace"] { top: 10px; animation-delay: 80ms; }
.pin-branch__opt[data-role="cancel"] { top: 48px; animation-delay: 140ms; color: var(--pin-ink-muted); }
.pin-branch__opt:hover:not(:disabled) { background: var(--pin-on-fill); color: var(--pin-on-ink); border-color: transparent; }
.pin-branch__opt:disabled { color: var(--pin-ink-faint); cursor: default; }
@keyframes branch-in { to { opacity: 1; transform: none; } }

.pin-branch__confirm {
  position: absolute;
  left: 34px;
  top: -12px;
  white-space: nowrap;
  border: none;
  border-radius: 999px;
  background: var(--pin-on-fill);
  color: var(--pin-on-ink);
  font: inherit;
  font-size: 11px;
  padding: 6px 13px;
  cursor: pointer;
  box-shadow: var(--pin-shadow);
  opacity: 0;
  transform: translateX(-12px);
  animation: branch-in 200ms var(--ease) forwards;
}

/* ------------------------------------------------------- the menu */

.pin-versions {
  position: absolute;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 7px;
  border: 1px solid var(--pin-rule);
  border-radius: 999px;
  background: var(--pin-paper);
  box-shadow: var(--pin-shadow-lg);
  font-family: var(--pin-mono);
}
/* Selecting is a different job, so the row says so without changing shape. */
.pin-versions[data-mode="selecting"] { box-shadow: 0 0 0 2px var(--pin-red-tint), var(--pin-shadow-lg); }

.pin-versions__mod {
  font-size: 10px;
  line-height: 1;
  color: var(--pin-ink-faint);
  padding: 0 3px;
  user-select: none;
  transition: color 120ms ease;
}
.pin-versions[data-armed="true"] .pin-versions__mod { color: var(--pin-ink); }

/*
 * A keycap, because the row is also the shortcut legend — the same mono chip
 * .pin-kbd already uses, and it fills the same way when its modifier is held.
 *
 * The max-width cap is deliberately close to the natural width. It is what the
 * collapse and the insert animate, and a cap far above the content means most
 * of the transition runs before anything visibly moves.
 */
.pin-key {
  font-family: var(--pin-mono);
  font-size: 10px;
  line-height: 1;
  min-width: 19px;
  height: 19px;
  max-width: 44px;
  padding: 0 5px;
  border: none;
  border-radius: 4px;
  background: var(--pin-paper-sunk);
  color: var(--pin-ink-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease,
    max-width var(--beat) var(--ease), min-width var(--beat) var(--ease),
    padding var(--beat) var(--ease), margin var(--beat) var(--ease),
    opacity 180ms ease, transform var(--beat) var(--ease);
}
.pin-key[data-on="true"] { background: var(--pin-on-fill); color: var(--pin-on-ink); }
.pin-key:focus-visible { outline: 2px solid var(--pin-ink); outline-offset: 2px; }

/* The original. Sunk plate and a hairline rather than a faded one, so it reads
   as a key that is present and not up for replacement, not one half-drawn. */
.pin-key[data-locked="true"] {
  background: var(--pin-paper);
  color: var(--pin-ink-muted);
  box-shadow: inset 0 0 0 1px var(--pin-rule);
  cursor: default;
}
/* Marked for replacement. Struck as well as tinted, so the state survives
   being read by someone who cannot see the red. */
.pin-key[data-doomed="true"] {
  background: var(--pin-red-tint);
  color: var(--pin-red-ink);
  box-shadow: inset 0 0 0 1px var(--pin-red);
}
.pin-key[data-doomed="true"] .pin-key__num { text-decoration: line-through; }

/* The collapse. Width, padding and margin run to zero together, so the
   survivors are carried left by ordinary flex reflow rather than a second
   animation that has to be kept in step with this one. The starting width is
   measured first, so the transition begins moving immediately. */
.pin-key[data-collapsing="true"] {
  max-width: 0;
  min-width: 0;
  padding: 0;
  margin-left: -4px;
  opacity: 0;
  transform: scale(0.55);
}

/* The insert. The key is built already collapsed, so its first resolved style
   is the zero state and nothing can flush it to full size before the frame
   that starts the growth. */
.pin-key[data-entering="true"] {
  max-width: 0;
  min-width: 0;
  padding: 0;
  margin-left: -4px;
  opacity: 0;
  transform: scale(0.55);
}

@keyframes key-land {
  0% { box-shadow: inset 0 0 0 0 var(--pin-ink); }
  40% { box-shadow: inset 0 0 0 2px var(--pin-ink), 0 0 0 4px var(--pin-measure-glow); }
  100% { box-shadow: inset 0 0 0 0 var(--pin-ink); }
}
.pin-key[data-landed="true"] { animation: key-land 520ms var(--ease); }

/* The survivors renumber after they have finished moving, not during. */
.pin-key__num { transition: opacity 140ms ease; }
.pin-key[data-renumbering="true"] .pin-key__num { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .pin-key, .variety, .pin-switch, .pin-switch i { transition-duration: 1ms; }
  .pin-branch__opt, .pin-branch__confirm, .pin-key[data-landed="true"] { animation-duration: 1ms; }
}

/* ------------------------------------------------------- mock scaffold */
/* Not part of the design. It exists so all three placements and the reset are
   reachable without resizing the window by hand. */

.rig {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: var(--sheet);
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.rig button {
  font: inherit;
  text-transform: none;
  letter-spacing: 0;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
}
.rig button[data-on="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stage { position: relative; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="pin-object" data-selected="true" id="obj">

    <div class="pin-object__card">
      <div class="pin-object__label">
        <span class="pin-object__name">VarietyCard</span>
        <span class="pin-object__src">src/components/VarietyCard.tsx:14</span>
      </div>

      <!-- The card, exactly as the film set serves it. -->
      <article class="variety" id="card">
        <div class="plate">
          <svg viewBox="0 0 100 80" fill="none" stroke="#1d4a3a" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="1.2" d="M50 32V74"/><path fill="#dde7e0" stroke-width="1.1" d="M50 60C41.8 60 34.4 55.1 32 46.9C41 46.1 48.4 51.8 50 60Z"/><path fill="#dde7e0" stroke-width="1.1" d="M50 68C56.6 68 63.1 63.9 64.8 57.3C57.4 56.5 50.8 61.4 50 68Z"/><g fill="#dde7e0" stroke-width="1.2"><path transform="translate(50 28) rotate(0) scale(1) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(72) scale(1) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(144) scale(1) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(216) scale(1) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(288) scale(1) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/></g><g fill="#dde7e0" stroke-width="1"><path transform="translate(50 28) rotate(36) scale(0.55) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(108) scale(0.55) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(180) scale(0.55) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(252) scale(0.55) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/><path transform="translate(50 28) rotate(324) scale(0.55) translate(-50 -28)" d="M50 28C44.1 24.7 41.4 17.4 44.1 12.1C46.1 8.2 53.9 8.2 55.9 12.1C58.6 17.4 55.9 24.7 50 28Z"/></g><circle cx="50" cy="28" r="2.1" fill="#dde7e0" stroke-width="0.9"/></svg>
          <span class="acc">ACC 0612</span>
        </div>
        <h3 class="card-name">Rose</h3>
        <p class="card-latin">Rosa gallica</p>
        <div class="traits">
          <div>Days<b>78</b></div>
          <div>Store<b>4y</b></div>
          <div>Germ<b>94%</b></div>
        </div>
      </article>
    </div>

    <div class="pin-note">
      <div class="pin-note__body">
        <input class="pin-note__input" id="draft" placeholder="Describe a change" autocomplete="off" aria-label="Pin annotation" />
        <button class="pin-note__send" id="send" data-idle="true" aria-label="Send to agent">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6"/></svg>
        </button>
      </div>

      <div class="pin-note__toggle">
        <label id="toggle-label" for="switch">Toggle</label>
        <button class="pin-switch" id="switch" role="switch" aria-checked="true" aria-labelledby="toggle-label" aria-describedby="hint"><i aria-hidden="true"></i></button>
      </div>

      <div class="pin-note__hint" id="hint"></div>
      <p class="sr-only" id="live" aria-live="polite" aria-atomic="true"></p>
    </div>
  </div>

  <div class="pin-versions" id="menu" role="group" aria-label="Versions"></div>
  <div class="pin-branch" id="branch"></div>
</div>

<div class="rig">
  <span>placement</span>
  <button data-place="auto" data-on="true">auto</button>
  <button data-place="card-right">right of card</button>
  <button data-place="note-right">right of box</button>
  <button data-place="card-left">left of card</button>
  <button id="reset" style="margin-left:18px">reset</button>
</div>

<script>
(function () {
  "use strict";

  /*
   * An option is a snapshot the agent produced, plus the words that asked for
   * it. In the extension these carry a messageId and a patch; here they carry
   * the CSS the patch would have written, which is enough to make switching
   * mean something on screen.
   */
  var MAX = 5;
  var seq = 0;
  function opt(label, style) { return { id: "o" + ++seq, label: label, style: style || {} }; }

  var BASE = { background: "", borderColor: "", borderRadius: "", padding: "", boxShadow: "" };

  /* Stand-ins for real agent output, cycled so a typed message visibly lands. */
  var LOOKS = [
    { background: "#f6f3ea", borderColor: "#e2ddcd", borderRadius: "4px", padding: "20px", boxShadow: "" },
    { background: "#ffffff", borderColor: "transparent", borderRadius: "20px", padding: "24px", boxShadow: "0 10px 30px rgba(27,26,21,0.09)" },
    { background: "#ffffff", borderColor: "#e2ddcd", borderRadius: "6px", padding: "13px", boxShadow: "0 1px 2px rgba(27,26,21,0.06)" },
    { background: "#f7ece6", borderColor: "#a33726", borderRadius: "14px", padding: "20px", boxShadow: "" }
  ];
  var lookAt = 0;
  function nextLook() { var l = LOOKS[lookAt % LOOKS.length]; lookAt++; return l; }

  var state = {
    options: [
      opt("original", BASE),
      opt("green wash", { background: "#e9efe9", borderColor: "#e2ddcd", borderRadius: "14px", padding: "20px", boxShadow: "" }),
      opt("stamp border, square", { background: "#ffffff", borderColor: "#a33726", borderRadius: "2px", padding: "20px", boxShadow: "" })
    ],
    current: 1,
    on: true,
    /* idle | branch | selecting */
    mode: "idle",
    pending: null,
    doomed: {},
    /* Set while a keycap is hovered in selecting mode, so you see what you are
       about to throw away rather than only which numeral it wears. */
    preview: null,
    place: "auto",
    kept: null,
    dropped: null,
    busy: false,
    /* Bumped by anything that invalidates an in-flight collapse. */
    gen: 0,
    timer: null,
    entering: null,
    renumbering: {}
  };

  var $ = function (id) { return document.getElementById(id); };
  var menu = $("menu"), card = $("card"), draft = $("draft"), branch = $("branch");

  function doomedCount() { return Object.keys(state.doomed).length; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  /* ------------------------------------------------------------- the card */

  function paintCard() {
    var o = state.preview
      || ((state.mode !== "idle" && state.pending) ? state.pending : state.options[state.current]);
    if (!o) return;
    var s = o.style;
    card.style.background = s.background || "";
    card.style.borderColor = s.borderColor || "";
    card.style.borderRadius = s.borderRadius || "";
    card.style.padding = s.padding || "";
    card.style.boxShadow = s.boxShadow || "";
    card.style.borderWidth = s.borderColor === "transparent" ? "0" : "";
  }

  /* ------------------------------------------------------------- the menu */

  function keyFor(o, i) {
    var b = document.createElement("button");
    b.className = "pin-key";
    b.type = "button";
    b.dataset.key = o.id;
    if (o.id === state.entering) b.dataset.entering = "true";
    if (state.renumbering[o.id]) b.dataset.renumbering = "true";

    var n = document.createElement("span");
    n.className = "pin-key__num";
    n.textContent = String(i + 1);
    b.appendChild(n);

    if (state.mode === "selecting") {
      if (i === 0) {
        b.dataset.locked = "true";
        b.setAttribute("aria-disabled", "true");
        b.setAttribute("aria-label", "Option 1, " + o.label + ", cannot be replaced");
      } else {
        var marked = !!state.doomed[o.id];
        b.dataset.doomed = marked ? "true" : "false";
        b.setAttribute("aria-pressed", marked ? "true" : "false");
        b.setAttribute("aria-label", "Option " + (i + 1) + ", " + o.label + (marked ? ", marked to replace" : ""));
        b.onclick = function () {
          if (state.busy) return;
          if (state.doomed[o.id]) delete state.doomed[o.id];
          else state.doomed[o.id] = true;
          render();
        };
        b.onmouseenter = function () { state.preview = o; paintCard(); };
        b.onmouseleave = function () { state.preview = null; paintCard(); };
      }
    } else {
      b.dataset.on = (i === state.current) ? "true" : "false";
      b.setAttribute("aria-pressed", b.dataset.on);
      b.setAttribute("aria-label", "Option " + (i + 1) + ", " + o.label);
      b.onclick = function () {
        if (state.busy) return;
        armedUsed = true;
        state.current = i;
        render();
      };
    }
    return b;
  }

  /* A rebuild throws away whatever had focus, which makes marking several
     options for replacement impossible from the keyboard. So the key that had
     it gets it back. */
  function withFocusKept(node, fn) {
    var active = document.activeElement;
    var key = (active && node.contains(active)) ? active.dataset.key || active.dataset.role : null;
    fn();
    if (!key) return;
    var next = node.querySelector('[data-key="' + key + '"], [data-role="' + key + '"]');
    if (next) next.focus();
  }

  function renderMenu() {
    withFocusKept(menu, function () {
      menu.innerHTML = "";
      if (!state.on) { menu.style.display = "none"; return; }
      menu.style.display = "";
      menu.dataset.armed = armed ? "true" : "false";
      menu.dataset.mode = state.mode;

      var mod = document.createElement("span");
      mod.className = "pin-versions__mod";
      mod.textContent = "⌥";
      mod.title = "hold to arm the keys, tap to step forward";
      menu.appendChild(mod);

      state.options.forEach(function (o, i) { menu.appendChild(keyFor(o, i)); });
    });
    if (state.on) place();
  }

  /* --------------------------------------------------------- the placement */
  /*
   * Right of the card and low, so the row clears both the identity plate on top
   * and the connector anchor that renders at the edge midpoint. Falls back the
   * way a tooltip does: try the preferred side, then the note, then mirror.
   *
   * The note tier is only offered when the note is genuinely wider than the
   * card. Docked under a card it is exactly the card's width (ui.css makes the
   * two share one edge), so trying it there would be the same placement under
   * a second name. It earns its place for the floating multi-select composer,
   * which is 380px regardless of what it is parked beneath.
   */
  function place() {
    var host = $("stage").getBoundingClientRect();
    var cardBox = card.getBoundingClientRect();
    var note = document.querySelector(".pin-note").getBoundingClientRect();
    var w = menu.offsetWidth || 140;
    var gap = 10;

    var noteIsWider = note.right > cardBox.right + 1;
    var order = state.place === "auto"
      ? (noteIsWider ? ["card-right", "note-right", "card-left"] : ["card-right", "card-left"])
      : [state.place];

    function fits(where) {
      if (where === "card-left") return cardBox.left - gap - w > 4;
      var from = where === "card-right" ? cardBox.right : note.right;
      return from + gap + w < window.innerWidth - 4;
    }

    var chosen = order.find(fits) || order[order.length - 1];

    var x =
      chosen === "card-right" ? cardBox.right + gap
        : chosen === "note-right" ? note.right + gap
          : cardBox.left - gap - w;

    /* Nothing fitting is a real state on a narrow window. Clamp rather than let
       the row leave the viewport, which is the one outcome worse than crowding. */
    x = Math.max(4, Math.min(x, window.innerWidth - w - 4));

    menu.style.left = (x - host.left) + "px";
    menu.style.top = (cardBox.bottom - host.top - menu.offsetHeight) + "px";
    menu.dataset.placed = chosen;
  }

  /* ------------------------------------------------------------ the branch */

  /* Seated against the switch, because that is the control the two futures grow
     out of. Recomputed on every render so it survives the note changing height. */
  function placeBranch() {
    if (state.mode === "idle") return;
    var host = $("stage").getBoundingClientRect();
    var sw = $("switch").getBoundingClientRect();
    branch.style.left = (sw.right - host.left + 9) + "px";
    branch.style.top = (sw.top - host.top + sw.height / 2) + "px";
  }

  function branchOpt(role, label, onClick, disabled, title) {
    var b = document.createElement("button");
    b.className = "pin-branch__opt";
    b.type = "button";
    b.dataset.role = role;
    b.textContent = label;
    if (disabled) b.disabled = true;
    if (title) b.title = title;
    b.onclick = onClick;
    return b;
  }

  function renderBranch() {
    withFocusKept(branch, function () {
      branch.innerHTML = "";
      if (state.mode === "branch") {
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", "30");
        svg.setAttribute("height", "1");
        svg.setAttribute("aria-hidden", "true");
        svg.innerHTML =
          '<path d="M0 0 H12 Q22 0 22 -10 V-22" fill="none" stroke="var(--pin-rule-strong)" stroke-width="1"/>' +
          '<path d="M0 0 H12 Q22 0 22 10 V22" fill="none" stroke="var(--pin-rule-strong)" stroke-width="1"/>';
        branch.appendChild(svg);

        var full = state.options.length >= MAX;
        branch.appendChild(branchOpt("add", "add", doAdd, full,
          full ? "five is the cap. replace one instead" : "keep it alongside the others"));
        branch.appendChild(branchOpt("replace", "replace", function () {
          if (state.busy) return;
          state.mode = "selecting";
          state.doomed = {};
          render();
        }));
        branch.appendChild(branchOpt("cancel", "never mind", cancel));
      }

      if (state.mode === "selecting") {
        if (doomedCount()) {
          var go = document.createElement("button");
          go.className = "pin-branch__confirm";
          go.type = "button";
          go.dataset.role = "confirm";
          go.textContent = "collapse " + doomedCount() + " into it";
          go.onclick = doReplace;
          branch.appendChild(go);
        }
        branch.appendChild(branchOpt("cancel", "never mind", cancel));
      }
    });
    placeBranch();
  }

  /* -------------------------------------------------------------- the hint */

  function hint() {
    if (!state.on) {
      return state.kept
        ? "Kept <b>" + esc(state.kept) + "</b>. The others were dropped."
        : "Turn Toggle on to keep more than one version of this card.";
    }
    if (state.mode === "branch") {
      return state.options.length >= MAX
        ? "Five is the cap, so this one has to replace something."
        : "Keep it alongside the others, or replace ones you already have.";
    }
    if (state.mode === "selecting") {
      return doomedCount()
        ? "Replacing <b>" + doomedCount() + "</b> with &ldquo;" + esc(state.pending.label) + "&rdquo;. Escape backs out."
        : "Select which options you want to replace.";
    }
    var o = state.options[state.current];
    return "Showing <b>" + esc(o.label) + "</b>. ⌥ steps forward, ⌥ and a number jumps, ⌘↩ on an empty line keeps it.";
  }

  /* Only the part that changes, so a switch does not re-read the whole legend. */
  function announce() {
    if (!state.on) { $("live").textContent = state.kept ? "Kept " + state.kept : ""; return; }
    if (state.mode !== "idle") { $("live").textContent = ""; return; }
    $("live").textContent =
      "Showing " + state.options[state.current].label +
      ", option " + (state.current + 1) + " of " + state.options.length;
  }

  function render() {
    renderMenu();
    renderBranch();
    $("hint").innerHTML = hint();
    if (!state.on && state.dropped) {
      var u = document.createElement("button");
      u.className = "pin-note__undo";
      u.type = "button";
      u.textContent = "undo";
      u.onclick = undoKeep;
      $("hint").appendChild(u);
    }
    $("switch").setAttribute("aria-checked", state.on ? "true" : "false");
    $("send").dataset.idle = draft.value.trim() ? "false" : "true";
    announce();
    paintCard();
  }

  /* ------------------------------------------------------- add and replace */

  /*
   * The key is created already collapsed, then released a frame later. Doing it
   * the other way round — build at full size, then shrink, then grow — loses
   * the entrance, because any layout read in between resolves it at full width
   * and the growth has nothing left to travel.
   */
  function enter(id) {
    state.entering = id;
    render();
    var n = menu.querySelector('.pin-key[data-key="' + id + '"]');
    if (!n) { state.entering = null; return; }

    /*
     * Released on the next painted frame, so the collapsed state is on screen
     * once before the growth starts. The timer is not belt and braces: rAF is
     * throttled to nothing in a background tab, and without a second way out
     * the key would sit at zero width — invisible, and permanently so, since
     * nothing else ever clears the flag.
     */
    var done = false;
    function release() {
      if (done) return;
      done = true;
      n.dataset.entering = "false";
      state.entering = null;
      n.dataset.landed = "true";
      window.setTimeout(function () { n.removeAttribute("data-landed"); }, 560);
    }
    requestAnimationFrame(function () { requestAnimationFrame(release); });
    window.setTimeout(release, 80);
  }

  function doAdd() {
    if (state.busy || state.options.length >= MAX || !state.pending) return;
    var added = state.pending;
    state.options.push(added);
    state.current = state.options.length - 1;
    state.pending = null;
    state.preview = null;
    state.mode = "idle";
    enter(added.id);
  }

  function doReplace() {
    if (state.busy) return;
    var dead = state.options.filter(function (o) { return state.doomed[o.id]; });
    if (!dead.length || !state.pending) return;

    /*
     * Everything the delayed half needs is captured now. Reading state inside
     * the timeout meant an Escape or a second click during the collapse could
     * null the pending option and splice it into the row, which threw halfway
     * through the next render and left the menu inert until reload.
     */
    var added = state.pending;
    var seat = Math.min.apply(null, dead.map(function (o) { return state.options.indexOf(o); }));
    var survivors = state.options.filter(function (o) { return !state.doomed[o.id]; });
    var gen = ++state.gen;
    state.busy = true;

    /* The survivors that are about to renumber drop their digit now and get it
       back once they have arrived, so no numeral changes while it is moving. */
    state.renumbering = {};
    survivors.forEach(function (o, i) {
      var was = state.options.indexOf(o);
      if (was !== i) state.renumbering[o.id] = true;
    });
    Object.keys(state.renumbering).forEach(function (id) {
      var n = menu.querySelector('.pin-key[data-key="' + id + '"]');
      if (n) n.dataset.renumbering = "true";
    });

    /* Collapse from the width they actually have. Left at the class cap, the
       first two thirds of the transition would run before anything narrowed. */
    dead.forEach(function (o) {
      var n = menu.querySelector('.pin-key[data-key="' + o.id + '"]');
      if (!n) return;
      n.style.maxWidth = n.offsetWidth + "px";
      void n.offsetWidth;
      n.dataset.collapsing = "true";
    });

    /* The confirm goes immediately, so it cannot be pressed a second time
       while the first press is still playing out. */
    var go = branch.querySelector('[data-role="confirm"]');
    if (go) go.remove();

    var beat = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 260;

    state.timer = window.setTimeout(function () {
      state.timer = null;
      if (gen !== state.gen) { state.busy = false; return; }

      /* The new one takes the lowest seat the dead ones held, so the row
         renumbers as little as it can get away with. */
      survivors.splice(seat, 0, added);
      state.options = survivors;
      state.current = seat;
      state.pending = null;
      state.preview = null;
      state.doomed = {};
      state.mode = "idle";
      state.busy = false;

      enter(added.id);

      window.setTimeout(function () {
        state.renumbering = {};
        menu.querySelectorAll('[data-renumbering="true"]').forEach(function (n) {
          n.dataset.renumbering = "false";
        });
      }, 60);
    }, beat);
  }

  /* ---------------------------------------------------------------- verbs */

  function send() {
    if (state.busy) return;
    var text = draft.value.trim();
    /* Empty is not a send. Keeping is deliberate and lives on ⌘↩ alone. */
    if (!text) return;

    /* A send while the comparison is closed reopens it rather than quietly
       stacking options behind a hidden menu. */
    if (!state.on) {
      state.on = true;
      state.kept = null;
      state.dropped = null;
    }

    var o = opt(text, nextLook());
    draft.value = "";

    /* Nothing to weigh it against yet, so it just becomes the second option. */
    if (state.options.length <= 1) {
      state.options.push(o);
      state.current = state.options.length - 1;
      state.mode = "idle";
      enter(o.id);
      return;
    }

    state.pending = o;
    state.mode = "branch";
    render();
  }

  function keep() {
    if (!state.on || state.busy) return;
    state.gen++;
    state.kept = "option " + (state.current + 1) + ", " + state.options[state.current].label;
    /* The losing snapshots go, so the whole set is stashed for the undo. */
    state.dropped = { options: state.options.slice(), current: state.current };
    var winner = state.options[state.current];
    state.options = [state.options[0], winner].filter(function (o, i, a) { return a.indexOf(o) === i; });
    state.current = state.options.length - 1;
    state.on = false;
    state.mode = "idle";
    state.pending = null;
    state.preview = null;
    render();
  }

  function undoKeep() {
    if (!state.dropped) return;
    state.options = state.dropped.options;
    state.current = state.dropped.current;
    state.dropped = null;
    state.kept = null;
    state.on = true;
    render();
    draft.focus();
  }

  function cancel() {
    if (state.mode === "idle") return;
    state.gen++;
    if (state.timer !== null) { window.clearTimeout(state.timer); state.timer = null; }
    state.busy = false;
    /* Backing out returns the words, which the send took out of the field.
       Losing a typed sentence to an Escape is not a cancel, it is a deletion. */
    if (state.pending) draft.value = state.pending.label;
    state.mode = "idle";
    state.pending = null;
    state.preview = null;
    state.doomed = {};
    state.renumbering = {};
    render();
    draft.focus();
  }

  /* ------------------------------------------------------------ the chord */

  var armed = false, armedAt = 0, armedUsed = false;

  window.addEventListener("keydown", function (e) {
    if (e.key === "Alt" && !e.repeat) {
      e.preventDefault();
      armed = true; armedAt = Date.now(); armedUsed = false;
      if (state.on) menu.dataset.armed = "true";
      return;
    }
    /* Any other key pressed inside the hold means it was a chord, not a tap. */
    if (armed) armedUsed = true;

    /* e.code, because Option and a digit emits ¡™£ on a Mac layout. */
    if (e.altKey && /^Digit[1-9]$/.test(e.code)) {
      e.preventDefault();
      var i = Number(e.code.slice(5)) - 1;
      if (state.on && state.mode === "idle" && i < state.options.length && !state.busy) {
        state.current = i;
        render();
        menu.dataset.armed = "true";
      }
      return;
    }

    if (e.key === "Escape") { cancel(); return; }

    /*
     * Enter belongs to the input, not the page. Left on window it cancelled the
     * native activation of every button — so Enter on "add" ran the empty-send
     * path instead, and quietly ended the comparison.
     */
    if (e.key === "Enter" && e.target === draft) {
      e.preventDefault();
      if (e.metaKey || e.ctrlKey) {
        /* Empty keeps. With words in the field it is the stash chord, which
           still has somewhere to go: the same branch a send opens. */
        if (draft.value.trim()) send();
        else keep();
      } else {
        send();
      }
      return;
    }

    /* Arrows only reach the menu while there is no caret to move, and never
       while Option is down — that combination belongs to the chord. */
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") &&
        !e.altKey && !draft.value && state.on && state.mode === "idle" && !state.busy) {
      e.preventDefault();
      var n = state.options.length;
      state.current = (state.current + (e.key === "ArrowRight" ? 1 : n - 1)) % n;
      render();
    }
  });

  window.addEventListener("keyup", function (e) {
    if (e.key !== "Alt") return;
    /* A tap, with nothing pressed inside it, steps forward the way Tab would. */
    if (armed && !armedUsed && Date.now() - armedAt < 400 && state.on && state.mode === "idle" && !state.busy) {
      state.current = (state.current + 1) % state.options.length;
      render();
    }
    armed = false;
    menu.dataset.armed = "false";
  });
  window.addEventListener("blur", function () { armed = false; menu.dataset.armed = "false"; });

  /* A click anywhere else backs out of a decision, the way any transient
     picker does. Without it, selecting mode had no mouse exit at all. */
  document.addEventListener("pointerdown", function (e) {
    if (state.mode === "idle" || state.busy) return;
    if (e.target.closest(".pin-note, .pin-versions, .pin-branch")) return;
    cancel();
  });

  /* ----------------------------------------------------------------- wire */

  $("send").onclick = send;
  draft.addEventListener("input", function () { $("send").dataset.idle = draft.value.trim() ? "false" : "true"; });
  $("switch").onclick = function () {
    if (state.busy) return;
    if (state.on) keep();
    else { state.on = true; state.kept = null; render(); }
  };

  document.querySelectorAll("[data-place]").forEach(function (b) {
    b.onclick = function () {
      state.place = b.dataset.place;
      document.querySelectorAll("[data-place]").forEach(function (o) { o.dataset.on = String(o === b); });
      place();
    };
  });

  $("reset").onclick = function () { location.reload(); };
  window.addEventListener("resize", function () { if (state.on) place(); placeBranch(); });

  render();
  draft.focus();
})();
</script>
</body>
</html>
